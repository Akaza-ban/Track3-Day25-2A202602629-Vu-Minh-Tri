[project]
name = "day25-gameday-lab"
version = "1.1.0"
description = "Lab 25B — Game Day: retry storms, circuit breakers, caching, idempotency and error budgets for LLM agents."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
plot = ["matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
